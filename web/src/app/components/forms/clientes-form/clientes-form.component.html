<div class="clientes-container">
  <h2>Clientes form</h2>

  <form [formGroup]="clientesForm">

    <div>
      <label for="id">id</label>
      <input id="id" type="number" formControlName="id">
    </div>

    <div>
      <label for="nombre">nombre</label>
      <input id="nombre" type="text" formControlName="nombre">
    </div>

    <div>
      <label for="direccion">direccion</label>
      <input id="direccion" type="text" formControlName="direccion">
    </div>

    <div>
      <label for="telefono">telefono</label>
      <input id="telefono" type="text" formControlName="telefono">
    </div>

    <div>
      <label for="tipo_cliente">tipo_cliente</label>
      <input id="tipo_cliente" type="text" formControlName="tipo_cliente">
    </div>

    <div>
      <label for="barrio">barrio</label>
      <input id="barrio" type="text" formControlName="barrio">
    </div>

    <div>
      <label for="geom">geom</label>
      <textarea id="geom" formControlName="geom"></textarea>
    </div>

    <div class="buttons">
      <button type="button" (click)="insert()">Insert</button>
      <button type="button" (click)="selectone()">Select one</button>
      <button type="button" (click)="selectall()">Select all</button>
      <button type="button" (click)="update()">Update</button>
      <button type="button" (click)="delete()">Delete</button>
      <button type="button" (click)="clean()">Clean</button>
    </div>

  </form>

  <p class="message">{{ message }}</p>

  <table *ngIf="clientes.length > 0">
    <thead>
      <tr>
        <th>id</th>
        <th>nombre</th>
        <th>direccion</th>
        <th>telefono</th>
        <th>tipo_cliente</th>
        <th>barrio</th>
        <th>geom</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let cliente of clientes">
        <td>{{ cliente.id }}</td>
        <td>{{ cliente.nombre }}</td>
        <td>{{ cliente.direccion }}</td>
        <td>{{ cliente.telefono }}</td>
        <td>{{ cliente.tipo_cliente }}</td>
        <td>{{ cliente.barrio }}</td>
        <td>{{ cliente.geom }}</td>
      </tr>
    </tbody>
  </table>
</div>
